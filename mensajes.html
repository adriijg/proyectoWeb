<section class="mensajes-container">
  <!-- Lista de conversaciones -->
  <aside class="lista-conversaciones">
    <h2>Mensajes</h2>
    <ul>
      <li class="conversacion activa" data-id="1">
        <img src="img/empresa1.png" alt="Logo Empresa" class="avatar">
        <div>
          <h3>Empresa Tech</h3>
          <p>Gracias por tu solicitud...</p>
        </div>
      </li>
      <li class="conversacion" data-id="2">
        <img src="img/usuario2.png" alt="Foto Usuario" class="avatar">
        <div>
          <h3>María López</h3>
          <p>Hola, vi tu perfil...</p>
        </div>
      </li>
    </ul>
  </aside>

  <!-- Ventana de chat -->
  <main class="ventana-chat">
    <header class="chat-header">
      <img src="img/empresa1.png" alt="Logo Empresa" class="avatar">
      <h3>Empresa Tech</h3>
    </header>

    <div class="chat-mensajes">
      <div class="mensaje empresa">
        <p>Hola, hemos visto tu CV y nos gustaría agendar una entrevista.</p>
        <span class="hora">10:15</span>
      </div>
      <div class="mensaje usuario">
        <p>¡Hola! Perfecto, estaré disponible mañana.</p>
        <span class="hora">10:17</span>
      </div>
    </div>

    <form class="chat-input">
      <input type="text" placeholder="Escribe un mensaje..." required>
      <button type="submit">Enviar</button>
    </form>
  </main>
  <link rel="stylesheet" href="css/mensajes.css">
  <link rel="stylesheet" href="js/mensajes.js">
</section>
